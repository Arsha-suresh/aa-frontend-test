@if (historyArray.data.length > 0) {
    <div class="historyContainer">
        <h3>Search History</h3>
        <div class="resultsContainer">
        <app-table [disableNext]="false" 
[hideColumn]="true"
[hidePagination]="true"
[data]="historyArray" [page]="page" 
[enableDeleteRow]="true"
(deleteRowOutput)="deleteRow($event)"
[deleteKey]="'label'"
[columns]="columns" (selId)="emitQuery($event)"></app-table>
    </div>
    </div>
    

}
